<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cover C — The Opportunity Mindset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ── Cover shell ─────────────────────────────────────── */
    #cover {
      position: relative;
      width: 850px;
      height: 1100px;
      background: #132238;
      overflow: hidden;
    }

    /* Amber accent panel — large shape behind title */
    .accent-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: 340px;
      height: 100%;
      background: #F0A500;
      z-index: 0;
    }

    /* Top edge of amber panel — slight angle for dynamism */
    .accent-panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: -60px;
      bottom: 0;
      width: 60px;
      background: inherit;
      clip-path: polygon(100% 0, 100% 100%, 0 100%, 60px 0);
    }

    /* ── Inner layout ────────────────────────────────────── */
    .inner {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 56px 60px 52px;
    }

    /* Series label */
    .series {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #F0A500;
    }

    /* ── Title block ─────────────────────────────────────── */
    .title-area {
      margin-top: auto;
      max-width: 580px;
    }

    .the {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 300;
      font-size: 28px;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 10px;
    }

    .opportunity {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 92px;
      color: #FFFFFF;
      line-height: 0.88;
      letter-spacing: -0.02em;
      display: block;
    }

    .mindset {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 92px;
      color: #F0A500;
      line-height: 0.88;
      letter-spacing: -0.02em;
      display: block;
    }

    /* Horizontal rule */
    .rule {
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.12);
      margin: 42px 0 36px;
    }

    /* Subtitle */
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.08em;
      line-height: 1.8;
      max-width: 440px;
    }

    /* ── Author ──────────────────────────────────────────── */
    .author-area {
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .author-block {}

    .author-label {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(240,165,0,0.6);
      margin-bottom: 6px;
    }

    .author-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 22px;
      color: #FFFFFF;
      letter-spacing: 0.01em;
    }

    .author-role {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      margin-top: 4px;
    }

    /* Publisher mark — sits on the amber panel side */
    .publisher-mark {
      text-align: right;
    }

    .publisher-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #132238;
    }

    .publisher-tag {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: rgba(19,34,56,0.6);
      margin-top: 3px;
    }

    /* Large background "O" watermark */
    .bg-letter {
      position: absolute;
      bottom: -80px;
      right: 20px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 480px;
      color: rgba(240,165,0,0.08);
      line-height: 1;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="cover">
  <div class="accent-panel"></div>
  <div class="bg-letter">O</div>

  <div class="inner">
    <div class="series">Filly Coder &ensp;·&ensp; AI Future Series</div>

    <div class="title-area">
      <span class="the">The</span>
      <span class="opportunity">Oppor&shy;tunity</span>
      <span class="mindset">Mindset</span>
    </div>

    <div class="rule"></div>

    <div class="subtitle">
      How to Recognize, Create,<br>
      and Capture Opportunity
    </div>

    <div class="author-area">
      <div class="author-block">
        <div class="author-label">Author</div>
        <div class="author-name">Bernard Baah</div>
        <div class="author-role">Founder &amp; CEO, Filly Coder</div>
      </div>
      <div class="publisher-mark">
        <div class="publisher-name">Filly Coder</div>
        <div class="publisher-tag">AI Future Series</div>
      </div>
    </div>
  </div>
</div>

<!-- ── Download ────────────────────────────────────────── -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  .dl-group {
    display: flex; gap: 10px;
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%); z-index: 999;
  }
  .dl-group button {
    padding: 10px 22px; border: none; border-radius: 3px; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: #F0A500; color: #132238;
    box-shadow: 0 4px 20px rgba(0,0,0,.5); transition: opacity .2s;
  }
  .dl-group button:disabled { opacity: .35; cursor: not-allowed; }
  .dl-group button:not(:disabled):hover { opacity: .8; }
</style>
<div class="dl-group">
  <button id="dl-jpg" onclick="downloadJPG()">⬇ Download JPG</button>
  <button id="dl-pdf" onclick="downloadPDF()">⬇ Download PDF</button>
</div>
<script>
  function renderCover() {
    return html2canvas(document.getElementById('cover'), {
      scale: 3, useCORS: true, width: 850, height: 1100, backgroundColor: '#132238'
    });
  }
  function setBtns(d) { ['dl-jpg','dl-pdf'].forEach(id => document.getElementById(id).disabled = d); }
  function downloadJPG() {
    setBtns(true);
    renderCover().then(c => {
      const a = document.createElement('a');
      a.download = 'opportunity-mindset-cover-c.jpg';
      a.href = c.toDataURL('image/jpeg', 0.95);
      a.click(); setBtns(false);
    });
  }
  function downloadPDF() {
    setBtns(true);
    renderCover().then(c => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:[152.4,228.6] });
      pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,152.4,228.6);
      pdf.save('opportunity-mindset-cover-c.pdf'); setBtns(false);
    });
  }
  window.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(location.search).get('download');
    if (p === 'jpg') setTimeout(downloadJPG, 900);
    if (p === 'pdf') setTimeout(downloadPDF, 900);
  });
</script>

</body>
</html>
