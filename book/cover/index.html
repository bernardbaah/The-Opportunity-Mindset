<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Opportunity Mindset – Cover A</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Montserrat', sans-serif;
    }

    #dl-btn {
      margin-bottom: 16px;
      padding: 12px 28px;
      background: #c9a84c;
      color: #0a1628;
      border: none;
      border-radius: 4px;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    #dl-btn:hover { background: #e0c070; }

    #cover {
      width: 850px;
      height: 1100px;
      background: #0a1628;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 60px 70px 50px;
    }

    /* Subtle texture overlay */
    #cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(201,168,76,0.08) 0%, transparent 65%),
        radial-gradient(ellipse at 80% 80%, rgba(10,22,60,0.6) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top accent line */
    .top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1;
    }
    .top-bar .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #c9a84c, transparent);
    }
    .top-bar .series-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.25em;
      color: #c9a84c;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Central flywheel diagram */
    .flywheel-wrap {
      position: relative;
      width: 420px;
      height: 420px;
      z-index: 1;
      flex-shrink: 0;
    }

    .flywheel-wrap svg {
      width: 100%;
      height: 100%;
    }

    /* Title block */
    .title-block {
      z-index: 1;
      text-align: center;
      width: 100%;
    }

    .pre-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 9.5px;
      letter-spacing: 0.35em;
      color: #c9a84c;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .main-title {
      font-family: 'Playfair Display', serif;
      font-size: 64px;
      font-weight: 900;
      color: #c9a84c;
      line-height: 1.05;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 40px rgba(201,168,76,0.25);
      margin-bottom: 10px;
    }

    .title-divider {
      width: 60px;
      height: 2px;
      background: #c9a84c;
      margin: 18px auto;
      opacity: 0.7;
    }

    .sub-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 19px;
      font-weight: 400;
      color: rgba(255,255,255,0.82);
      line-height: 1.5;
      letter-spacing: 0.04em;
    }

    /* Bottom block */
    .bottom-block {
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .bottom-rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,0.5), transparent);
      margin-bottom: 4px;
    }

    .author-name {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .bottom-tagline {
      font-family: 'Montserrat', sans-serif;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: rgba(201,168,76,0.65);
      text-transform: uppercase;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      z-index: 2;
    }
    .corner.tl { top: 22px; left: 22px; border-top: 1.5px solid #c9a84c; border-left: 1.5px solid #c9a84c; }
    .corner.tr { top: 22px; right: 22px; border-top: 1.5px solid #c9a84c; border-right: 1.5px solid #c9a84c; }
    .corner.bl { bottom: 22px; left: 22px; border-bottom: 1.5px solid #c9a84c; border-left: 1.5px solid #c9a84c; }
    .corner.br { bottom: 22px; right: 22px; border-bottom: 1.5px solid #c9a84c; border-right: 1.5px solid #c9a84c; }

  </style>
</head>
<body>

  <button id="dl-btn" onclick="downloadCover()">⬇ Download Cover (KDP Ready)</button>

  <div id="cover">
    <!-- Corner ornaments -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Top bar -->
    <div class="top-bar">
      <div class="line"></div>
      <div class="series-tag">Filly Coder &nbsp;·&nbsp; AI Future Series</div>
      <div class="line"></div>
    </div>

    <!-- Title block -->
    <div class="title-block">
      <div class="pre-title">A Framework for Success</div>
      <div class="main-title">The Opportunity<br>Mindset</div>
      <div class="title-divider"></div>
      <div class="sub-title">How to Recognize, Create,<br>and Capture Opportunity</div>
    </div>

    <!-- Flywheel diagram -->
    <div class="flywheel-wrap">
      <svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#c9a84c" stop-opacity="0"/>
          </radialGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
              <feMergeNode in="coloredBlur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Glow background -->
        <circle cx="210" cy="210" r="180" fill="url(#glowGrad)"/>

        <!-- Concentric rings -->
        <circle cx="210" cy="210" r="170" fill="none" stroke="#c9a84c" stroke-width="0.5" opacity="0.2"/>
        <circle cx="210" cy="210" r="148" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.25"/>
        <circle cx="210" cy="210" r="118" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
        <circle cx="210" cy="210" r="90"  fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>
        <circle cx="210" cy="210" r="55"  fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.4"/>
        <circle cx="210" cy="210" r="22"  fill="#c9a84c" opacity="0.9"/>
        <circle cx="210" cy="210" r="22"  fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>

        <!-- Center spark -->
        <circle cx="210" cy="210" r="8" fill="#ffffff" opacity="0.95"/>

        <!-- 6 nodes on main ring (r=148) with labels -->
        <!-- Discover  @ 270deg (top) -->
        <circle cx="210" cy="62"  r="11" fill="#0a1628" stroke="#c9a84c" stroke-width="1.8" filter="url(#glow)"/>
        <circle cx="210" cy="62"  r="5"  fill="#c9a84c"/>
        <!-- Learn @ 330deg -->
        <circle cx="338" cy="136" r="11" fill="#0a1628" stroke="#c9a84c" stroke-width="1.8" filter="url(#glow)"/>
        <circle cx="338" cy="136" r="5"  fill="#c9a84c"/>
        <!-- Build @ 30deg -->
        <circle cx="338" cy="284" r="11" fill="#0a1628" stroke="#c9a84c" stroke-width="1.8" filter="url(#glow)"/>
        <circle cx="338" cy="284" r="5"  fill="#c9a84c"/>
        <!-- Connect @ 90deg (bottom) -->
        <circle cx="210" cy="358" r="11" fill="#0a1628" stroke="#c9a84c" stroke-width="1.8" filter="url(#glow)"/>
        <circle cx="210" cy="358" r="5"  fill="#c9a84c"/>
        <!-- Create @ 150deg -->
        <circle cx="82"  cy="284" r="11" fill="#0a1628" stroke="#c9a84c" stroke-width="1.8" filter="url(#glow)"/>
        <circle cx="82"  cy="284" r="5"  fill="#c9a84c"/>
        <!-- Reinvest @ 210deg -->
        <circle cx="82"  cy="136" r="11" fill="#0a1628" stroke="#c9a84c" stroke-width="1.8" filter="url(#glow)"/>
        <circle cx="82"  cy="136" r="5"  fill="#c9a84c"/>

        <!-- Curved arrows between nodes (arcs on r=148 path) -->
        <!-- Discover→Learn arc -->
        <path d="M 218 63 A 148 148 0 0 1 337 143" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" marker-end="url(#arrow)"/>
        <!-- Learn→Build arc -->
        <path d="M 345 147 A 148 148 0 0 1 345 277" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" marker-end="url(#arrow)"/>
        <!-- Build→Connect arc -->
        <path d="M 337 293 A 148 148 0 0 1 218 357" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" marker-end="url(#arrow)"/>
        <!-- Connect→Create arc -->
        <path d="M 202 357 A 148 148 0 0 1 83 293" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" marker-end="url(#arrow)"/>
        <!-- Create→Reinvest arc -->
        <path d="M 75 277 A 148 148 0 0 1 75 147" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" marker-end="url(#arrow)"/>
        <!-- Reinvest→Discover arc -->
        <path d="M 83 129 A 148 148 0 0 1 202 63" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" marker-end="url(#arrow)"/>

        <defs>
          <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#c9a84c" opacity="0.85"/>
          </marker>
        </defs>

        <!-- Labels -->
        <text x="210" y="36"  text-anchor="middle" font-family="Montserrat,sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.12em">DISCOVER</text>
        <text x="365" y="131" text-anchor="start"   font-family="Montserrat,sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.12em">LEARN</text>
        <text x="357" y="295" text-anchor="start"   font-family="Montserrat,sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.12em">BUILD</text>
        <text x="210" y="390" text-anchor="middle"  font-family="Montserrat,sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.12em">CONNECT</text>
        <text x="68"  y="295" text-anchor="end"     font-family="Montserrat,sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.12em">CREATE</text>
        <text x="66"  y="131" text-anchor="end"     font-family="Montserrat,sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="0.12em">REINVEST</text>

        <!-- Center label -->
        <text x="210" y="204" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="9" font-weight="700" fill="#c9a84c" letter-spacing="0.2em">THE</text>
        <text x="210" y="218" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="9" font-weight="700" fill="#c9a84c" letter-spacing="0.2em">FLYWHEEL</text>
      </svg>
    </div>

    <!-- Bottom block -->
    <div class="bottom-block">
      <div class="bottom-rule"></div>
      <div class="author-name">Bernard Baah</div>
      <div class="bottom-tagline">Filly Coder &nbsp;·&nbsp; AI Future Series</div>
    </div>

  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    function downloadCover() {
      const btn = document.getElementById('dl-btn');
      btn.style.display = 'none';
      html2canvas(document.getElementById('cover'), {
        scale: 3,
        useCORS: true,
        width: 850,
        height: 1100,
        backgroundColor: '#0a1628'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'opportunity-mindset-cover-A.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.style.display = 'block';
      });
    }
  </script>
</body>
</html>
