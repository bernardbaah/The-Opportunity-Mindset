<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Opportunity Mindset – Cover B</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Serif+Display&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Inter', sans-serif;
    }

    #dl-btn {
      margin-bottom: 16px;
      padding: 12px 28px;
      background: #d4a843;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    #dl-btn:hover { background: #e8be5a; }

    #cover {
      width: 850px;
      height: 1100px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0;
      /* Gradient background */
      background: linear-gradient(160deg, #1c1c2e 0%, #16213e 40%, #0f3460 100%);
    }

    /* Diagonal accent slab */
    #cover::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -80px;
      width: 440px;
      height: 780px;
      background: linear-gradient(135deg, rgba(212,168,67,0.07) 0%, rgba(15,52,96,0.0) 100%);
      border-left: 1px solid rgba(212,168,67,0.15);
      transform: rotate(12deg);
      pointer-events: none;
      z-index: 0;
    }

    /* Horizontal accent lines */
    #cover::after {
      content: '';
      position: absolute;
      bottom: 200px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, rgba(212,168,67,0.6), rgba(212,168,67,0.1));
      z-index: 0;
    }

    .top-strip {
      width: 100%;
      height: 6px;
      background: linear-gradient(to right, #d4a843, #f0d080, #d4a843);
      flex-shrink: 0;
      z-index: 2;
    }

    .content-wrap {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 50px 70px 50px 70px;
      position: relative;
      z-index: 1;
    }

    .series-tag {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.32em;
      color: rgba(212,168,67,0.75);
      text-transform: uppercase;
      margin-bottom: 0;
    }

    /* Compass / pathway visual */
    .compass-wrap {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin: -10px 0 -10px 0;
    }
    .compass-wrap svg {
      width: 340px;
      height: 340px;
      opacity: 0.95;
    }

    /* Title block */
    .title-block {
      width: 100%;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: #d4a843;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .main-title {
      font-family: 'Inter', sans-serif;
      font-size: 74px;
      font-weight: 900;
      color: #ffffff;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 0;
      text-transform: uppercase;
    }

    .main-title .highlight {
      color: #d4a843;
      display: block;
    }

    .title-underline {
      width: 80px;
      height: 3px;
      background: #d4a843;
      margin: 22px 0;
    }

    .subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      line-height: 1.6;
      letter-spacing: 0.04em;
      max-width: 480px;
    }

    /* Bottom block */
    .bottom-block {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .author-block {}

    .author-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: rgba(212,168,67,0.6);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .author-name {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
    }

    .publisher-logo {
      text-align: right;
    }
    .publisher-logo .pub-name {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: rgba(212,168,67,0.55);
      text-transform: uppercase;
      line-height: 1.8;
    }

    /* Floating dot grid decoration */
    .dot-grid {
      position: absolute;
      top: 60px;
      left: 50px;
      z-index: 0;
      opacity: 0.12;
    }
  </style>
</head>
<body>

  <button id="dl-btn" onclick="downloadCover()">⬇ Download Cover (KDP Ready)</button>

  <div id="cover">
    <div class="top-strip"></div>

    <!-- Dot grid decoration (SVG) -->
    <svg class="dot-grid" width="160" height="300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.4" fill="#d4a843"/>
        </pattern>
      </defs>
      <rect width="160" height="300" fill="url(#dots)"/>
    </svg>

    <div class="content-wrap">

      <div class="series-tag">Filly Coder &nbsp;·&nbsp; AI Future Series</div>

      <!-- Compass graphic -->
      <div class="compass-wrap">
        <svg viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="compassGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#d4a843" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
            </radialGradient>
            <filter id="softGlow">
              <feGaussianBlur stdDeviation="4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <linearGradient id="pathGrad" x1="0" y1="1" x2="0" y2="0">
              <stop offset="0%" stop-color="#d4a843" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#d4a843" stop-opacity="1"/>
            </linearGradient>
          </defs>

          <!-- Glow -->
          <circle cx="170" cy="170" r="150" fill="url(#compassGlow)"/>

          <!-- Outer ring -->
          <circle cx="170" cy="170" r="148" fill="none" stroke="#d4a843" stroke-width="1" opacity="0.3"/>
          <!-- Tick marks -->
          <g stroke="#d4a843" stroke-width="1" opacity="0.4">
            <line x1="170" y1="22"  x2="170" y2="38"/>
            <line x1="170" y1="302" x2="170" y2="318"/>
            <line x1="22"  y1="170" x2="38"  y2="170"/>
            <line x1="302" y1="170" x2="318" y2="170"/>
            <!-- Cardinal diagonals -->
            <line x1="65"  y1="65"  x2="75"  y2="75"/>
            <line x1="275" y1="65"  x2="265" y2="75"/>
            <line x1="65"  y1="275" x2="75"  y2="265"/>
            <line x1="275" y1="275" x2="265" y2="265"/>
          </g>

          <!-- Cardinal labels -->
          <text x="170" y="16" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#d4a843" letter-spacing="0.15em">N</text>
          <text x="170" y="332" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="rgba(212,168,67,0.45)" letter-spacing="0.15em">S</text>
          <text x="326" y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="rgba(212,168,67,0.45)" letter-spacing="0.15em">E</text>
          <text x="14"  y="175" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="rgba(212,168,67,0.45)" letter-spacing="0.15em">W</text>

          <!-- Inner circle -->
          <circle cx="170" cy="170" r="55" fill="none" stroke="#d4a843" stroke-width="1" opacity="0.35"/>
          <circle cx="170" cy="170" r="30" fill="none" stroke="#d4a843" stroke-width="0.8" opacity="0.25"/>
          <circle cx="170" cy="170" r="10" fill="#d4a843" opacity="0.9"/>
          <circle cx="170" cy="170" r="5"  fill="#ffffff"/>

          <!-- North needle (gold, bold, pointing up) -->
          <polygon points="170,40 158,170 170,155 182,170" fill="url(#pathGrad)" filter="url(#softGlow)"/>
          <!-- South needle (dim) -->
          <polygon points="170,300 158,170 170,185 182,170" fill="rgba(255,255,255,0.12)"/>
          <!-- East needle (dim) -->
          <polygon points="300,170 170,158 185,170 170,182" fill="rgba(255,255,255,0.12)"/>
          <!-- West needle (dim) -->
          <polygon points="40,170 170,158 155,170 170,182" fill="rgba(255,255,255,0.12)"/>

          <!-- Ascending pathway dots -->
          <circle cx="170" cy="120" r="3" fill="#d4a843" opacity="0.6"/>
          <circle cx="170" cy="90"  r="4" fill="#d4a843" opacity="0.75"/>
          <circle cx="170" cy="60"  r="5" fill="#d4a843" opacity="0.9" filter="url(#softGlow)"/>

          <!-- "OPPORTUNITY" arc text effect using tspan path -->
          <path id="arcTop" d="M 55 170 A 115 115 0 0 1 285 170" fill="none"/>
          <text font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="rgba(212,168,67,0.55)" letter-spacing="0.22em">
            <textPath href="#arcTop" startOffset="8%">OPPORTUNITY &nbsp;·&nbsp; GROWTH &nbsp;·&nbsp; PURPOSE</textPath>
          </text>
        </svg>
      </div>

      <!-- Title -->
      <div class="title-block">
        <div class="eyebrow">The Modern Framework</div>
        <div class="main-title">
          The<br>
          <span class="highlight">Opportunity</span>
          Mindset
        </div>
        <div class="title-underline"></div>
        <div class="subtitle">How to Recognize, Create,<br>and Capture Opportunity</div>
      </div>

      <!-- Bottom -->
      <div class="bottom-block">
        <div class="author-block">
          <div class="author-label">Author</div>
          <div class="author-name">Bernard Baah</div>
        </div>
        <div class="publisher-logo">
          <div class="pub-name">Filly Coder</div>
          <div class="pub-name">AI Future Series</div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>
    function downloadCover() {
      const btn = document.getElementById('dl-btn');
      btn.style.display = 'none';
      html2canvas(document.getElementById('cover'), {
        scale: 3,
        useCORS: true,
        width: 850,
        height: 1100,
        backgroundColor: '#1c1c2e'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'opportunity-mindset-cover-B.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        btn.style.display = 'block';
      });
    }
  </script>
</body>
</html>
