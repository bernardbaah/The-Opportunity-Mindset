<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Opportunity Mindset – Cover Variant 2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #e8e4dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 20px 60px;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── COVER ─────────────────────────────────────────────────── */
    #cover {
      position: relative;
      width: 850px;
      height: 1100px;
      background-color: #faf8f3;
      overflow: hidden;
      box-shadow:
        0 4px 6px rgba(0,0,0,0.06),
        0 12px 40px rgba(0,0,0,0.14),
        0 30px 80px rgba(0,0,0,0.10);
    }

    /* Subtle texture layer */
    #cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(10,22,40,0.012) 3px,
          rgba(10,22,40,0.012) 4px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Top spine rule */
    .spine-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 7px;
      background: #0a1628;
    }

    /* Bottom spine rule */
    .spine-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 7px;
      background: #0a1628;
    }

    /* ── INNER LAYOUT ───────────────────────────────────────────── */
    .cover-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 82px;
    }

    /* ── SERIES TAGLINE (top) ───────────────────────────────────── */
    .series-top {
      margin-top: 40px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 9.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #c9a84c;
    }

    /* ── TITLE BLOCK ────────────────────────────────────────────── */
    .title-block {
      margin-top: 46px;
      flex-shrink: 0;
    }

    .title-article {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 52px;
      letter-spacing: 0.06em;
      color: #0a1628;
      line-height: 1;
      margin-bottom: 2px;
    }

    .title-main {
      display: block;
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 96px;
      letter-spacing: -0.01em;
      color: #0a1628;
      line-height: 0.92;
      word-spacing: -4px;
    }

    .title-main .word-opportunity {
      display: block;
    }

    .title-main .word-mindset {
      display: block;
      position: relative;
    }

    /* Gold underline beneath "Mindset" */
    .title-main .word-mindset::after {
      content: '';
      display: block;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #c9a84c 0%, #e8c96a 50%, #c9a84c 100%);
      margin-top: 10px;
      border-radius: 2px;
    }

    /* ── PRIMARY DIVIDER ────────────────────────────────────────── */
    .divider-block {
      margin-top: 44px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .divider-rule {
      flex: 1;
      height: 2px;
      background: #0a1628;
    }

    .divider-diamond {
      width: 8px;
      height: 8px;
      background: #c9a84c;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ── ILLUSTRATION: COMPASS ──────────────────────────────────── */
    .illustration-wrapper {
      margin-top: 50px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .compass-svg {
      display: block;
    }

    /* ── SUBTITLE ───────────────────────────────────────────────── */
    .subtitle-block {
      margin-top: 48px;
      width: 100%;
      flex-shrink: 0;
    }

    .subtitle-label {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 9px;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 11px;
    }

    .subtitle-text {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-style: italic;
      font-size: 22px;
      letter-spacing: 0.01em;
      color: #0a1628;
      line-height: 1.45;
      max-width: 500px;
    }

    /* ── AUTHOR BLOCK ───────────────────────────────────────────── */
    .author-block {
      margin-top: auto;
      padding-bottom: 52px;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .author-name {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #0a1628;
    }

    .author-rule {
      display: block;
      width: 42px;
      height: 1.5px;
      background: #c9a84c;
      margin-bottom: 10px;
    }

    .series-badge {
      text-align: right;
    }

    .series-badge-line1 {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 8.5px;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: #6b7a91;
      margin-bottom: 3px;
    }

    .series-badge-line2 {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 8.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #0a1628;
    }

    /* ── DOWNLOAD BUTTON ────────────────────────────────────────── */
    #dl-btn {
      margin-top: 36px;
      padding: 14px 38px;
      background: #0a1628;
      color: #faf8f3;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
      outline: none;
      position: relative;
    }

    #dl-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border: 1.5px solid #c9a84c;
      pointer-events: none;
    }

    #dl-btn:hover {
      background: #c9a84c;
      color: #0a1628;
    }

    #dl-btn:disabled {
      cursor: default;
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     COVER
════════════════════════════════════════════════════════════════ -->
<div id="cover">

  <!-- Spine rules -->
  <div class="spine-top"></div>
  <div class="spine-bottom"></div>

  <!-- Inner layout -->
  <div class="cover-inner">

    <!-- Series top label -->
    <span class="series-top">Filly Coder &nbsp;·&nbsp; AI Future Series</span>

    <!-- Title -->
    <div class="title-block">
      <span class="title-article">The</span>
      <span class="title-main">
        <span class="word-opportunity">Opportunity</span>
        <span class="word-mindset">Mindset</span>
      </span>
    </div>

    <!-- Divider -->
    <div class="divider-block">
      <div class="divider-rule"></div>
      <div class="divider-diamond"></div>
      <div class="divider-rule"></div>
    </div>

    <!-- Illustration: Compass -->
    <div class="illustration-wrapper">
      <svg class="compass-svg" width="130" height="130" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Outer circle -->
        <circle cx="65" cy="65" r="58" stroke="#0a1628" stroke-width="1.4"/>
        <!-- Inner circle (thin) -->
        <circle cx="65" cy="65" r="48" stroke="#0a1628" stroke-width="0.6" stroke-dasharray="3 4"/>
        <!-- Cardinal tick marks -->
        <line x1="65" y1="7" x2="65" y2="17" stroke="#0a1628" stroke-width="1.4"/>
        <line x1="65" y1="113" x2="65" y2="123" stroke="#0a1628" stroke-width="1.4"/>
        <line x1="7" y1="65" x2="17" y2="65" stroke="#0a1628" stroke-width="1.4"/>
        <line x1="113" y1="65" x2="123" y2="65" stroke="#0a1628" stroke-width="1.4"/>
        <!-- Minor tick marks -->
        <line x1="65" y1="7" x2="65" y2="11" stroke="#0a1628" stroke-width="0.8" transform="rotate(45 65 65)"/>
        <line x1="65" y1="7" x2="65" y2="11" stroke="#0a1628" stroke-width="0.8" transform="rotate(90 65 65)"/>
        <line x1="65" y1="7" x2="65" y2="11" stroke="#0a1628" stroke-width="0.8" transform="rotate(135 65 65)"/>
        <line x1="65" y1="7" x2="65" y2="11" stroke="#0a1628" stroke-width="0.8" transform="rotate(225 65 65)"/>
        <line x1="65" y1="7" x2="65" y2="11" stroke="#0a1628" stroke-width="0.8" transform="rotate(270 65 65)"/>
        <line x1="65" y1="7" x2="65" y2="11" stroke="#0a1628" stroke-width="0.8" transform="rotate(315 65 65)"/>
        <!-- North needle (gold, pointing NE-ish, upward) -->
        <polygon points="65,20 60.5,65 65,59 69.5,65" fill="#c9a84c"/>
        <!-- South needle (dark navy) -->
        <polygon points="65,110 60.5,65 65,71 69.5,65" fill="#0a1628" opacity="0.55"/>
        <!-- Center hub -->
        <circle cx="65" cy="65" r="4.5" fill="#faf8f3" stroke="#0a1628" stroke-width="1.2"/>
        <circle cx="65" cy="65" r="1.8" fill="#c9a84c"/>
        <!-- N cardinal label -->
        <text x="65" y="33" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="9" font-weight="500" letter-spacing="0.1em" fill="#0a1628">N</text>
      </svg>
    </div>

    <!-- Subtitle -->
    <div class="subtitle-block">
      <span class="subtitle-label">How to</span>
      <span class="subtitle-text">Recognize, Create, and Capture Opportunity</span>
    </div>

    <!-- Author + Series badge -->
    <div class="author-block">
      <div>
        <span class="author-rule"></span>
        <span class="author-name">Bernard Baah</span>
      </div>
      <div class="series-badge">
        <span class="series-badge-line1">Filly Coder</span>
        <span class="series-badge-line2">AI Future Series</span>
      </div>
    </div>

  </div><!-- /cover-inner -->
</div><!-- /cover -->

<!-- ════════════════════════════════════════════════════════════════
     DOWNLOAD BUTTON
════════════════════════════════════════════════════════════════ -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<button id="dl-btn" onclick="downloadCover()">⬇ Download Cover (KDP Ready)</button>
<script>
function downloadCover() {
  const btn = document.getElementById('dl-btn');
  btn.style.opacity = '0.4';
  btn.disabled = true;
  html2canvas(document.getElementById('cover'), {
    scale: 3,
    useCORS: true,
    width: 850,
    height: 1100,
    backgroundColor: null
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'opportunity-mindset-cover.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.style.opacity = '1';
    btn.disabled = false;
  });
}
</script>

</body>
</html>
