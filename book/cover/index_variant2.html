<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cover B — The Opportunity Mindset</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* ── Cover shell ─────────────────────────────────────── */
    #cover {
      position: relative;
      width: 850px;
      height: 1100px;
      background: #0D0B09;
      overflow: hidden;
    }

    /* Vignette */
    #cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Warm midtone glow behind title */
    .glow {
      position: absolute;
      top: 220px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(180,130,50,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* ── Inner layout ────────────────────────────────────── */
    .inner {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 58px 68px 54px;
    }

    /* Top rule */
    .top-rule {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 0;
    }
    .top-rule-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #C8923C, transparent);
    }

    /* Series */
    .series {
      font-family: 'Inter', sans-serif;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #C8923C;
      opacity: 0.65;
      margin: 20px 0;
    }

    .series-rule {
      width: 40px;
      height: 1px;
      background: rgba(200,146,60,0.35);
      margin: 0 auto;
    }

    /* Title */
    .title-area {
      margin-top: auto;
      width: 100%;
    }

    .the {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 38px;
      color: #9A8870;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 4px;
    }

    .opportunity {
      font-family: 'EB Garamond', serif;
      font-weight: 800;
      font-size: 98px;
      color: #EDE0CC;
      line-height: 0.88;
      letter-spacing: -0.01em;
      display: block;
    }

    .mindset {
      font-family: 'EB Garamond', serif;
      font-weight: 800;
      font-size: 98px;
      color: #EDE0CC;
      line-height: 0.88;
      letter-spacing: -0.01em;
      display: block;
      margin-bottom: 40px;
    }

    /* Gold rule below title */
    .mid-rule {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 4px 0 36px;
    }
    .mid-rule-thick {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, #C8923C 20%, #C8923C 80%, transparent);
    }
    .mid-rule-thin {
      width: 60%;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(200,146,60,0.4) 30%, rgba(200,146,60,0.4) 70%, transparent);
    }

    /* Subtitle */
    .subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 13px;
      color: #7A6E62;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      line-height: 1.9;
    }

    /* Author */
    .author-area {
      margin-top: auto;
    }

    .author-name {
      font-family: 'EB Garamond', serif;
      font-weight: 500;
      font-size: 22px;
      color: #C8923C;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .author-title {
      font-family: 'Inter', sans-serif;
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #5A5048;
      margin-top: 6px;
    }

    /* Bottom rule */
    .bottom-rule {
      width: 100%;
      margin-top: 32px;
      display: flex;
      align-items: center;
      gap: 0;
    }
    .bottom-rule-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #C8923C, transparent);
    }

    .footer-text {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #C8923C;
      opacity: 0.5;
      margin-top: 14px;
    }
  </style>
</head>
<body>

<div id="cover">
  <div class="glow"></div>

  <div class="inner">
    <div class="top-rule">
      <div class="top-rule-line"></div>
    </div>

    <div class="series">Filly Coder &ensp;·&ensp; AI Future Series</div>
    <div class="series-rule"></div>

    <div class="title-area">
      <span class="the">The</span>
      <span class="opportunity">Opportunity</span>
      <span class="mindset">Mindset</span>
    </div>

    <div class="mid-rule">
      <div class="mid-rule-thick"></div>
      <div class="mid-rule-thin"></div>
    </div>

    <div class="subtitle">
      How to Recognize, Create,<br>and Capture Opportunity
    </div>

    <div class="author-area">
      <div class="author-name">Bernard Baah</div>
      <div class="author-title">Founder &amp; CEO, Filly Coder</div>
    </div>

    <div class="bottom-rule">
      <div class="bottom-rule-line"></div>
    </div>
    <div class="footer-text">Filly Coder Press</div>
  </div>
</div>

<!-- ── Download ────────────────────────────────────────── -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  .dl-group {
    display: flex; gap: 10px;
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%); z-index: 999;
  }
  .dl-group button {
    padding: 10px 22px; border: 1px solid rgba(200,146,60,0.5);
    border-radius: 3px; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    background: rgba(13,11,9,0.85); color: #C8923C;
    box-shadow: 0 4px 16px rgba(0,0,0,.6); transition: opacity .2s;
    backdrop-filter: blur(8px);
  }
  .dl-group button:disabled { opacity: .3; cursor: not-allowed; }
  .dl-group button:not(:disabled):hover { background: rgba(200,146,60,.12); }
</style>
<div class="dl-group">
  <button id="dl-jpg" onclick="downloadJPG()">⬇ Download JPG</button>
  <button id="dl-pdf" onclick="downloadPDF()">⬇ Download PDF</button>
</div>
<script>
  function renderCover() {
    return html2canvas(document.getElementById('cover'), {
      scale: 3, useCORS: true, width: 850, height: 1100, backgroundColor: '#0D0B09'
    });
  }
  function setBtns(d) { ['dl-jpg','dl-pdf'].forEach(id => document.getElementById(id).disabled = d); }
  function downloadJPG() {
    setBtns(true);
    renderCover().then(c => {
      const a = document.createElement('a');
      a.download = 'opportunity-mindset-cover-b.jpg';
      a.href = c.toDataURL('image/jpeg', 0.95);
      a.click(); setBtns(false);
    });
  }
  function downloadPDF() {
    setBtns(true);
    renderCover().then(c => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:[152.4,228.6] });
      pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,152.4,228.6);
      pdf.save('opportunity-mindset-cover-b.pdf'); setBtns(false);
    });
  }
  window.addEventListener('DOMContentLoaded', () => {
    const p = new URLSearchParams(location.search).get('download');
    if (p === 'jpg') setTimeout(downloadJPG, 900);
    if (p === 'pdf') setTimeout(downloadPDF, 900);
  });
</script>

</body>
</html>
